<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluation Report | UMS Demo</title>
<style>

:root{
 --brand:#4338ca;
 --brand-dark:#312e81;
 --ink:#172033;
 --muted:#64748b;
 --line:#dbe2ea;
 --soft:#f6f8fc;
 --danger:#dc2626;
 --success:#15803d;
}
*{box-sizing:border-box}
html{font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{margin:0;background:#eef2f7;font-size:14px}
button,input,select{font:inherit}
button,a{transition:.18s ease}
.topbar{
 height:58px;
 display:flex;
 align-items:center;
 gap:22px;
 padding:0 18px;
 background:linear-gradient(110deg,var(--brand-dark),var(--brand));
 color:#fff;
 box-shadow:0 3px 15px #312e8138;
 position:sticky;
 top:0;
 z-index:50
}
.brand{
 min-width:72px;
 font-size:18px;
 font-weight:800;
 line-height:.9;
 letter-spacing:-.4px
}
.brand small{font-size:10px;font-weight:600;opacity:.78}
.topnav{display:flex;gap:4px;align-self:stretch}
.topnav .module-item{
 display:flex;
 align-items:center;
 padding:0 13px;
 color:#e0e7ff;
 text-decoration:none;
 border-bottom:3px solid transparent
}
.topnav .module-item.active{
 background:#ffffff12;
 border-bottom-color:#c7d2fe;
 color:#fff
}
.top-actions{
 margin-left:auto;
 display:flex;
 align-items:center;
 gap:11px;
 flex-shrink:0
}
.demo-badge{
 border:1px solid #c7d2fe;
 border-radius:999px;
 padding:5px 9px;
 background:#ffffff14;
 color:#fff;
 text-decoration:none!important;
 font-size:11px;
 font-weight:700;
 cursor:pointer
}
.profile{font-size:12px;color:#eef2ff}
.icon-btn{
 border:0;
 background:#ffffff14;
 color:#fff;
 width:34px;
 height:34px;
 border-radius:9px;
 cursor:pointer
}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 58px)}
.sidebar{
 background:#fff;
 border-right:1px solid var(--line);
 padding:14px 12px 28px;
 overflow:auto
}
.sidebar-search{position:relative;margin-bottom:12px}
.sidebar-search input{
 width:100%;
 height:38px;
 border:1px solid var(--line);
 border-radius:8px;
 padding:0 34px 0 11px;
 outline:none
}
.sidebar-search input:focus{border-color:var(--brand)}
.sidebar-search span{
 position:absolute;
 right:11px;
 top:9px;
 color:#94a3b8
}
.module-title{
 background:var(--brand);
 color:#fff;
 padding:10px 12px;
 border-radius:8px;
 font-weight:700;
 margin-bottom:8px
}
.menu-section{margin:5px 0}
.section-label{
 width:100%;
 text-align:left;
 padding:10px 11px;
 border:0;
 background:#f1f5f9;
 border-radius:7px;
 color:#334155;
 font-weight:700
}
.menu-section.open .section-label{color:var(--brand-dark)}
.submenu{padding:5px 2px 5px 10px}
.submenu a{
 display:block;
 padding:7px 9px;
 color:#475569;
 text-decoration:none;
 border-left:2px solid #e2e8f0;
 font-size:12px;
 line-height:1.25
}
.submenu a:hover{color:var(--brand);background:#eef2ff}
.submenu a.active{
 color:var(--brand-dark);
 background:#e0e7ff;
 border-left-color:var(--brand);
 font-weight:800
}
.content{padding:18px;min-width:0}
.breadcrumb{
 color:var(--muted);
 font-size:12px;
 margin:0 0 11px
}
.panel{
 background:#fff;
 border:1px solid var(--line);
 border-radius:11px;
 box-shadow:0 3px 13px #0f172a0a;
 overflow:hidden;
 margin-bottom:16px
}
.panel-head{
 min-height:46px;
 display:flex;
 align-items:center;
 padding:0 14px;
 background:linear-gradient(95deg,var(--brand-dark),var(--brand));
 color:#fff
}
.panel-head h1,.panel-head h2{
 margin:0;
 font-size:15px;
 line-height:1.2
}
.panel-head h1{font-size:16px}
.panel-head p{
 margin:3px 0 0;
 font-size:11px;
 color:#e0e7ff
}
.panel-toggle{
 margin-left:auto;
 border:0;
 background:#ffffff18;
 color:#fff;
 width:29px;
 height:29px;
 border-radius:7px;
 cursor:pointer;
 font-size:19px
}
.panel-body{padding:16px}
.filters{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px 20px
}
.field{
 display:grid;
 grid-template-columns:135px minmax(0,1fr);
 gap:10px;
 align-items:start
}
.field.full{grid-column:1/-1}
.field label{
 padding-top:10px;
 text-align:right;
 font-weight:700;
 font-size:12px;
 color:#334155
}
.required{color:var(--danger)}
.control,select{
 width:100%;
 min-height:39px;
 border:1px solid #cbd5e1;
 border-radius:7px;
 background:#fff;
 color:#334155;
 padding:8px 10px;
 outline:none
}
.control:focus,select:focus,.multi.open .multi-button{
 border-color:var(--brand);
 box-shadow:0 0 0 3px #4338ca18
}
.date-pair{
 display:grid;
 grid-template-columns:1fr 42px 1fr;
 gap:8px;
 align-items:center
}
.date-pair span{text-align:center;color:var(--muted);font-size:12px}
.multi{position:relative;min-width:0}
.multi-button{
 min-height:39px;
 width:100%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 border:1px solid #cbd5e1;
 border-radius:7px;
 background:#fff;
 padding:8px 10px;
 color:#334155;
 cursor:pointer;
 text-align:left
}
.multi-button span:first-child{
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}
.chevron{color:#94a3b8}
.multi-menu{
 display:none;
 position:absolute;
 left:0;
 right:0;
 top:calc(100% + 5px);
 max-height:230px;
 overflow:auto;
 background:#fff;
 border:1px solid #cbd5e1;
 border-radius:8px;
 box-shadow:0 12px 32px #0f172a22;
 z-index:25;
 padding:5px
}
.multi.open .multi-menu{display:block}
.multi-option{
 display:flex;
 align-items:center;
 gap:8px;
 padding:7px;
 border-radius:6px;
 cursor:pointer;
 font-size:12px
}
.multi-option:hover{background:#eef2ff}
.multi-option input{accent-color:var(--brand)}
.error{
 display:none;
 grid-column:2;
 color:var(--danger);
 font-size:11px;
 margin-top:-6px
}
.required{display:none}
.date-control-wrap{position:relative;min-width:0}
.date-input{cursor:pointer;background:#fff}
.date-picker{
 position:absolute;
 z-index:90;
 top:calc(100% + 2px);
 left:0;
 width:210px;
 padding:8px;
 border:1px solid #ccc;
 border-radius:3px;
 background:#fff;
 box-shadow:0 6px 14px rgba(0,0,0,.22)
}
.date-picker[hidden]{display:none}
.calendar-head{
 display:grid;
 grid-template-columns:30px 1fr 30px;
 align-items:center;
 margin-bottom:6px
}
.calendar-head button{
 display:flex;
 align-items:center;
 justify-content:center;
 height:28px;
 padding:0;
 border:0;
 border-radius:3px;
 background:transparent;
 color:#444;
 font-size:21px;
 font-weight:700;
 line-height:28px;
 transition:background-color .12s ease
}
.calendar-head .glyphicon{
 top:0;
 font-size:14px;
 line-height:1
}
.calendar-title{
 min-width:0;
 height:28px;
 border-radius:3px;
 text-align:center;
 font-weight:700;
 line-height:28px;
 transition:background-color .12s ease
}
.calendar-head button:hover,
.calendar-head button:focus-visible,
.calendar-title:hover{
 background:#eee
}
.calendar-week,.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:2px
}
.calendar-week span{
 padding:4px 0;
 text-align:center;
 font-size:12px;
 font-weight:700
}
.calendar-day{
 height:28px;
 padding:0;
 border:0;
 border-radius:3px;
 background:#fff;
 color:#333;
 font-size:12px
}
.calendar-day:hover,.calendar-day:focus{background:#e8f2fb}
.calendar-day.outside{color:#aaa}
.calendar-day.selected{
 background:#0d6efd;
 color:#fff;
 font-weight:700
}
.calendar-day.today:not(.selected){
 box-shadow:inset 0 0 0 1px #428bca
}
.error.show{display:block}
.invalid{border-color:var(--danger)!important}
.form-actions{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-top:17px;
 padding-top:15px;
 border-top:1px solid #eef2f7
}
.btn{
 min-width:142px;
 border:0;
 border-radius:7px;
 padding:10px 15px;
 font-weight:750;
 cursor:pointer
}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#3730a3}
.btn-secondary{background:#0f766e;color:#fff}
.btn-secondary:hover{background:#115e59}
.report-meta{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
 padding:0 0 12px;
 color:var(--muted);
 font-size:12px
}
.table-scroll{
 overflow:auto;
 max-height:520px;
 border:1px solid var(--line);
 border-radius:8px
}
table{
 width:max-content;
 min-width:100%;
 border-collapse:separate;
 border-spacing:0;
 font-size:11px
}
th,td{
 min-width:96px;
 padding:10px 9px;
 border-right:1px solid var(--line);
 border-bottom:1px solid var(--line);
 text-align:center;
 vertical-align:middle;
 background:#fff
}
th{
 position:sticky;
 top:0;
 z-index:2;
 background:#eef2ff;
 color:#312e81;
 font-weight:800
}
th:first-child,td:first-child{
 position:sticky;
 left:0;
 min-width:52px;
 z-index:1
}
th:first-child{z-index:3;background:#e0e7ff}
tbody tr:nth-child(even) td{background:#f8fafc}
tbody tr:hover td{background:#eef2ff}
td.number{text-align:right;font-variant-numeric:tabular-nums}
.table-footer{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding-top:12px;
 font-size:12px;
 color:var(--muted)
}
.pagination{display:flex;gap:4px;flex-wrap:wrap}
.pagination button{
 min-width:32px;
 height:32px;
 border:1px solid var(--line);
 border-radius:6px;
 background:#fff;
 color:#475569;
 cursor:pointer
}
.pagination button.active{
 background:var(--brand);
 border-color:var(--brand);
 color:#fff
}
.pagination button:disabled{opacity:.45;cursor:not-allowed}
.modal{
 position:fixed;
 inset:0;
 display:none;
 place-items:center;
 padding:18px;
 background:#0f172a80;
 z-index:90
}
.modal.open{display:grid}
.modal-card{
 width:min(440px,100%);
 background:#fff;
 border-radius:12px;
 padding:20px;
 box-shadow:0 20px 60px #0f172a55
}
.modal-card h3{margin:0 0 7px;color:var(--brand-dark)}
.modal-card p{margin:0 0 16px;color:var(--muted);line-height:1.55}
.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#166534;
 color:#fff;
 border-radius:9px;
 padding:11px 15px;
 box-shadow:0 10px 28px #0f172a33;
 opacity:0;
 transform:translateY(12px);
 pointer-events:none;
 z-index:110
}
.toast.show{opacity:1;transform:none}
.toast.error{background:#b91c1c}
footer{text-align:center;color:#64748b;font-size:11px;padding:24px}
body.sidebar-hidden .layout{grid-template-columns:0 minmax(0,1fr)}
body.sidebar-hidden .sidebar{overflow:hidden;padding:0;border:0}
@media(max-width:980px){
 .topnav{display:none}
 .layout{grid-template-columns:210px minmax(0,1fr)}
 .filters{grid-template-columns:1fr}
 .field.full{grid-column:auto}
}
@media(max-width:720px){
 .topbar{gap:10px;padding:0 10px}
 .profile{display:none}
 .top-actions{position:absolute;right:10px;top:14px}
 .top-actions .icon-btn{display:none}
 .demo-badge{font-size:10px;padding:4px 7px;white-space:nowrap}
 .layout{display:block}
 .sidebar{
  position:fixed;
  inset:58px auto 0 0;
  width:250px;
  z-index:45;
  box-shadow:10px 0 25px #0f172a20
 }
 body.sidebar-hidden .sidebar{display:none}
 body:not(.sidebar-hidden) .content{filter:brightness(.86)}
 .content{padding:12px}
 .field{grid-template-columns:1fr;gap:5px}
 .field label{text-align:left;padding-top:0}
 .error{grid-column:1}
 .date-pair{grid-template-columns:1fr}
 .date-pair span{display:none}
 .form-actions{flex-direction:column}
 .btn{width:100%}
 .table-footer{align-items:flex-start;flex-direction:column}
}
/* Canonical UMS Final Common Design shell */
:root{
 --nav:#4338ca;
 --brand:#2f1031;
 --brand-hover:#421744;
 --demo:#10b981;
 --primary:#428bca;
 --primary-dark:#357ebd;
 --danger:#d9534f;
 --text:#333;
 --muted:#777;
 --line:#d9d9d9;
 --soft:#f7f7f7;
 --header-height:50px;
 --sidebar-width:210px;
 --content-gutter:15px;
 --control-height:34px
}
html,body{
 margin:0;
 min-height:100%;
 font-family:"Open Sans",Arial,sans-serif;
 font-size:14px;
 color:var(--text);
 background:#fff
}
.topbar{
 position:fixed;
 z-index:60;
 inset:0 0 auto;
 height:var(--header-height);
 display:flex;
 align-items:center;
 gap:0;
 padding:0 15px;
 background:var(--nav);
 color:#fff;
 box-shadow:0 1px 3px rgba(0,0,0,.35)
}
.brand{
 display:flex;
 align-items:center;
 flex:0 0 92px;
 width:92px;
 min-width:0;
 margin-left:-15px;
 font-size:0;
 line-height:normal
}
#sidebarToggle{
 display:none;
 width:40px;
 height:50px;
 border:0;
 border-radius:0;
 background:transparent;
 color:#fff;
 font-size:22px;
 line-height:1
}
.demo-badge{
 display:flex;
 align-items:center;
 width:92px;
 height:50px;
 padding:0 0 0 8px;
 border:0;
 border-radius:0;
 background:transparent;
 color:#fff;
 text-decoration:none!important;
 font-size:0
}
.demo-badge::after{
 content:"Demo Design";
 display:inline-block;
 padding:5px 6px;
 border:2px solid #fff;
 border-radius:6px;
 background:var(--demo);
 color:#fff;
 font-size:11.5px;
 font-weight:700;
 line-height:1.2;
 text-decoration:none!important;
 white-space:nowrap
}
.demo-badge:hover,.demo-badge:focus,.demo-badge:active{
 color:#fff;
 text-decoration:none!important
}
.topnav{
 display:flex;
 align-items:center;
 align-self:auto;
 gap:0
}
.topnav .module-item{
 display:block;
 padding:15px;
 color:#ddd;
 line-height:20px;
 border:0;
 background:transparent;
 cursor:default;
 user-select:none
}
.topnav .module-item.active{
 color:#fff;
 border:0;
 background:transparent
}
.top-actions{
 position:static;
 margin-left:auto;
 display:flex;
 align-items:center;
 height:50px;
 gap:0;
 flex-shrink:0
}
.profile{
 display:block;
 padding:15px;
 color:#fff;
 font-size:14px
}
.top-actions .icon-btn{
 display:flex;
 align-items:center;
 justify-content:center;
 width:52px;
 height:50px;
 border:0;
 border-radius:0;
 background:transparent;
 color:#fff
}
.top-actions .icon-btn svg{
 width:18px;
 height:18px;
 fill:currentColor
}
.layout{
 display:grid;
 grid-template-columns:11% minmax(0,89%);
 min-height:100vh;
 padding-top:var(--header-height)
}
.sidebar{
 width:100%;
 max-width:var(--sidebar-width);
 padding:10px 10px 0;
 border-right:1px solid #cfcfcf;
 background:#fff;
 overflow:visible
}
.sidebar-search{
 position:relative;
 margin-bottom:5px
}
.sidebar-search input{
 width:100%;
 height:var(--control-height);
 padding:6px 34px 6px 12px;
 border:1px solid #ccc;
 border-radius:4px
}
.clear-search{
 position:absolute;
 top:4px;
 right:3px;
 width:26px;
 height:26px;
 padding:0;
 border:0;
 border-radius:50%;
 background:#ddd;
 color:#888;
 font-size:20px;
 line-height:22px
}
.module-title{
 margin:0 0 5px;
 padding:10px 15px;
 border-radius:4px;
 background:var(--brand);
 color:#fff;
 font-weight:400;
 font-size:14px;
 line-height:20px
}
.menu-section{
 margin:0 0 5px;
 border:1px solid #ddd;
 border-radius:4px;
 background:#f5f5f5;
 box-shadow:0 1px 1px rgba(0,0,0,.05)
}
.section-label{
 width:100%;
 padding:10px 15px;
 border:0;
 border-radius:0;
 background:transparent;
 color:#333;
 text-align:left;
 font-weight:400;
 line-height:20px
}
.menu-section.open .section-label{color:#333}
.submenu{
 display:none;
 padding:4px 11px 7px;
 background:#fff
}
.menu-section.open .submenu{display:block}
.submenu a{
 display:block;
 padding:5px 0;
 border:0;
 border-bottom:1px solid #eee;
 color:#3d2b3e;
 font-size:14px;
 line-height:normal
}
.submenu a:last-child{border:0}
.submenu a:hover{color:#3d2b3e;background:transparent}
.submenu a.active{

 background:transparent;
 color:#3d2b3e;
 font-weight:700
}
.content{
 min-width:0;
 padding:10px var(--content-gutter) 70px
}
.breadcrumb{display:none}
.panel{
 margin-bottom:15px;
 border:1px solid var(--brand);
 border-radius:4px;
 background:#fff;
 overflow:visible;
 box-shadow:0 1px 1px rgba(0,0,0,.05)
}
.panel-head{
 min-height:40px;
 padding:9px 15px;
 border-radius:3px 3px 0 0;
 background:var(--brand);
 color:#fff
}
#filterPanel .panel-head{cursor:pointer;user-select:none}
#reportPanel .panel-head{cursor:default;user-select:auto}
#reportPanel .panel-toggle{display:none}
.panel-head h1,.panel-head h2{

 font-weight:700

.panel-head p{display:none}
.panel-body{padding:15px}
.filters{

.field{

.control,select,.multi-button{

 border-radius:3px;

}
.multi-search{

 z-index:2;
 top:0;
 display:block;
 width:100%;
 height:34px;
 margin-bottom:5px;
 padding:6px 10px;
 border:1px solid #ccc;
 background:#fff;
 color:#333;
 outline:0

.multi-search:focus{
 border-color:#66afe9;
 box-shadow:0 0 4px rgba(102,175,233,.6)
}
.multi-option.select-all{

}
.multi-empty{

 padding:8px;
 color:#777
}
.multi-option{
 gap:8px;
 padding:6px 7px;
 border-radius:0;
 font-size:14px
}
.multi-option:hover{background:#f3f4f6}
.date-pair{grid-template-columns:1fr}
.date-pair span{display:none}
.error{
 grid-column:2;
 margin-top:0;
 color:var(--danger);
 font-size:12px
}
.form-actions{
 gap:8px;
 margin-top:0;
 padding-top:18px;
 border:0
}
.btn{

 min-height:34px;
 padding:7px 13px;
 border:1px solid transparent;
 border-radius:3px;
 font-weight:400
}
.btn-primary{
 border-color:var(--primary-dark);
 background:var(--primary)
}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{
 border-color:var(--primary-dark);
 background:var(--primary)
}
.btn-secondary:hover{background:var(--primary-dark)}
#filterPanel .panel-toggle{display:block}
.panel-toggle{
 width:28px;
 height:24px;
 margin-left:auto;
 padding:0;
 border:0;
 border-radius:0;
 background:transparent;
 color:#fff;
 font-size:21px;
 line-height:20px
}
.report-meta{
 padding:0;
 margin:0 0 12px;
 color:#333;
 font-size:13px
}
.table-scroll{
 max-height:520px;
 border:1px solid #222;
 border-radius:0
}
table{
 min-width:2800px;
 border-collapse:collapse;
 table-layout:fixed;
 font-size:14px
}
th,td{
 min-width:96px;
 height:43px;
 padding:8px;
 border:1px solid #222;
 background:#fff;
 text-align:center
}
th{
 background:#fafafa;
 color:#333;
 font-size:14px;
 font-weight:700;
 white-space:nowrap
}
#reportPanel table{font-size:12px}
#reportPanel th{font-size:12px}
#reportPanel th,#reportPanel td{min-width:88px}
#reportPanel th:first-child{
 background:#fafafa;
 color:#333;
 top:0;
 z-index:4
}
#reportPanel th:first-child,
#reportPanel td:first-child{
 position:sticky;
 left:0;
 min-width:52px
}
#reportPanel td:first-child{z-index:2;background:#fff}
tbody tr:nth-child(even) td,
tbody tr:hover td{background:#fff}
.table-footer{
 padding-top:10px;
 color:#333;
 font-size:12px
}
.pagination button{
 border:1px solid #ddd;
 border-radius:3px;
 color:#337ab7
}
.pagination button.active{
 border-color:#ddd;
 background:#f5f5f5;
 color:#555
}
.modal-card{
 border-radius:5px;
 box-shadow:0 5px 22px rgba(0,0,0,.35)
}
.modal-card h3{
 margin:-20px -20px 15px;
 padding:13px 17px;
 background:var(--brand);
 color:#fff
}
.toast{
 top:65px;
 right:auto;
 bottom:auto;
 left:50%;
 border:1px solid #b2dba1;
 border-radius:4px;
 background:#dff0d8;
 color:#3c763d;
 transform:translateX(-50%);
 box-shadow:0 2px 8px #999
}
.toast.show{transform:translateX(-50%)}
footer{padding:40px 10px 12px;color:#666}
body.sidebar-hidden .layout{
 grid-template-columns:11% minmax(0,89%)
}
body.sidebar-hidden .sidebar{
 padding:10px 10px 0;
 border-right:1px solid #cfcfcf;
 overflow:visible
}
@media(max-width:1600px){
 .layout{grid-template-columns:13% minmax(0,87%)}
 body.sidebar-hidden .layout{
  grid-template-columns:13% minmax(0,87%)
 }
}
@media(max-width:1120px){
 .profile{display:none}
 .filters{column-gap:24px}
 .field{grid-template-columns:135px minmax(160px,1fr)}
}
@media(max-width:1000px){
 #sidebarToggle{display:block}
 .brand{
  flex-basis:auto;
  width:auto;
  margin-left:0
 }
 .demo-badge{width:auto;padding-left:0}
 .topnav,.top-actions{display:none}
 .layout,body.sidebar-hidden .layout{
  grid-template-columns:minmax(0,1fr)
 }
 .sidebar,body.sidebar-hidden .sidebar{
  position:fixed;
  z-index:55;
  top:50px;
  bottom:0;
  left:-230px;
  width:210px;
  max-width:210px;
  overflow:auto;
  padding:10px 10px 0;
  border-right:1px solid #cfcfcf;
  transition:left .2s
 }
 body:not(.sidebar-hidden) .sidebar{left:0}
 body:not(.sidebar-hidden) .content{filter:none}
 .content{padding:10px 10px 70px}
 .filters{grid-template-columns:minmax(0,1fr)}
 .field{grid-template-columns:165px minmax(0,1fr)}
}
@media(max-width:760px){
 .content{padding:5px 5px 70px}
 .panel-body{padding:12px 10px}
 .filters{display:block}
 .field{
  grid-template-columns:minmax(0,1fr);
  gap:5px;
  margin-bottom:12px
 }
 .field label{text-align:left}
 .error{grid-column:1}
 .form-actions{justify-content:flex-start}
 .btn{width:auto}
}

.glyphicon{
 position:relative;
 top:1px;
 display:inline-block;
 font-family:'Glyphicons Halflings';
 font-style:normal;
 font-weight:400;
 line-height:1;
 -webkit-font-smoothing:antialiased;
 -moz-osx-font-smoothing:grayscale
}
.glyphicon-search:before{content:"\e003"}
.glyphicon-chevron-down:before{content:"\e114"}
.glyphicon-arrow-left:before{content:"\e091"}
.glyphicon-arrow-right:before{content:"\e092"}
/* Canonical UMS multi-select treatment from the supplied references. */
.multi-button{
 position:relative;
 height:34px;
 min-height:34px;
 padding:6px 30px 6px 10px;
 border:1px solid #adadad;
 border-radius:4px;
 background:#f4f4f4;
 color:#222;
 font-size:13px;
 line-height:20px
}
.multi-button:hover{background:#eaeaea}
.multi.open{z-index:80}
.multi-button .multi-label{display:block;min-width:0}
.multi-button .chevron{
 position:absolute;
 top:50%;
 right:10px;
 margin-top:-5px;
 color:#333;
 font-size:9px
}
.multi.open .multi-button{
 border-color:#adadad;
 box-shadow:inset 0 2px 4px rgba(0,0,0,.12)
}
.multi-menu{
 top:calc(100% + 1px);
 max-height:none;
 overflow:hidden;
 padding:0;
 border:1px solid #adadad;
 border-radius:3px;
 background:#fff;
 box-shadow:0 3px 8px rgba(0,0,0,.22);
 z-index:60
}
.multi.drop-up .multi-menu{
 top:auto;
 bottom:calc(100% + 1px)
}
.multi-search-row{
 display:flex;
 align-items:stretch;
 height:34px;
 margin:6px 5px 7px
}
.multi-search-icon{
 flex:0 0 39px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:1px solid #ccc;
 border-radius:4px 0 0 4px;
 background:#f5f5f5;
 color:#111;
 font-size:14px
}
.multi-search{
 position:static;
 flex:1 1 auto;
 width:1%;
 height:34px;
 margin:0;
 padding:6px 11px;
 border:1px solid #ccc;
 border-left:0;
 border-radius:0;
 background:#fff;
 color:#333;
 font-size:13px;
 line-height:20px
}
.multi-search:focus{
 position:relative;
 border-color:#66afe9;
 box-shadow:0 0 4px rgba(102,175,233,.6)
}
.multi-options{
 max-height:250px;
 overflow-x:hidden;
 overflow-y:auto;
 padding:0 0 5px
}
.multi-option,
.multi-option.select-all{
 min-height:29px;
 gap:7px;
 padding:4px 14px 4px 18px;
 border:0;
 border-radius:0;
 color:#111;
 font-size:14px;
 line-height:20px;
 white-space:normal
}
.multi-option.select-all{font-weight:700}
.multi-option:hover{background:#f5f5f5}
.multi-option input{
 flex:0 0 auto;
 width:13px;
 height:13px;
 margin:0;
 accent-color:#337ab7
}
.multi-empty{padding:6px 18px 10px;font-size:13px}
#pageChangesBtn{
 position:absolute;
 left:50%;
 top:11px;
 z-index:1031;
 transform:translateX(-50%);
 padding:6px 12px;
 border:2px solid #fff;
 border-radius:6px;
 background:#f59e0b;
 color:#fff;
 font-size:12.5px;
 font-weight:700;
 line-height:1.2;
 text-decoration:none;
 white-space:nowrap;
 animation:pageChangesPulse 1.6s infinite
}
@keyframes pageChangesPulse{
 0%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}
 70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}
 100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}
}
#pageChangesModal .modal-card{
 width:60%;
 max-width:none;
 height:65vh;
 padding:0;
 display:flex;
 flex-direction:column;
 overflow:hidden
}
.page-changes-head{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 16px;
 background:#4338ca;
 color:#fff
}
.page-changes-head h3{
 flex:1;
 margin:0;
 padding:0;
 background:transparent;
 color:#fff;
 font-size:15px
}
.page-changes-body{
 flex:1;
 overflow-y:auto;
 padding:16px 22px;
 line-height:1.55
}
.page-changes-body li{margin-bottom:10px}
.page-changes-footer{
 padding:10px 16px;
 border-top:1px solid #ddd;
 text-align:right
}
@media(max-width:760px){
 #pageChangesBtn{left:55%;font-size:11px}
 #pageChangesModal .modal-card{width:96%}
}



.report-content{padding-bottom:70px}
.monitor-panel{margin-bottom:20px}
.monitor-filter-body{padding:22px 30px 26px;overflow:visible}
.report-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:45px;row-gap:15px}
.report-filter-grid .field{grid-template-columns:180px minmax(190px,1fr);gap:12px;align-items:center}
.report-filter-grid .field label{padding-top:0;text-align:right;font-size:14px;font-weight:700;color:#333}
.date-control{background:#eee;color:#555}
.form-actions{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:20px}
.form-actions .btn+.btn{margin-left:0}
.filter-heading{cursor:pointer}
.filter-heading h1{margin:0;font-size:14px}
.panel-toggle{margin-left:auto;font-size:18px;font-weight:700}
.report-heading{display:flex;align-items:center;gap:12px}
#reportPanel .panel-toggle{display:none}
#reportPanel .panel-body{padding:0}
.report-table-wrap{height:507px;width:100%;max-width:100%;overflow:auto;border:0;border-bottom:1px solid #333}
.report-table{min-width:1960px;border-collapse:collapse;table-layout:fixed}
#reportPanel .report-table th,#reportPanel .report-table td{min-width:0;padding:8px 10px;border:1px solid #ddd;text-align:center;vertical-align:middle;overflow-wrap:break-word;font-size:14px}
.report-table th{position:sticky;top:0;z-index:1;height:80px;background:#f7f7f7;color:#321234;white-space:normal;line-height:1.25}
.report-table td{height:72px}
.report-table th:first-child,.report-table td:first-child{position:sticky;left:0;width:54px;min-width:54px;max-width:54px}
.report-table th:first-child{z-index:3;background:#f7f7f7}
.report-table td:first-child{z-index:2;background:#fff}
.report-table tbody tr:nth-child(even) td,.report-table tbody tr:hover td{background:#fff}
.report-table tbody tr:nth-child(even) td:first-child,.report-table tbody tr:hover td:first-child{background:#fff}
.report-table th:nth-child(2),.report-table td:nth-child(2){width:125px}
.report-table th:nth-child(3),.report-table td:nth-child(3){width:145px}
.report-table th:nth-child(4),.report-table td:nth-child(4){width:175px}
.report-table th:nth-child(5),.report-table td:nth-child(5){width:105px}
.report-table td.text-left,.report-table th.text-left{text-align:left}
.report-table .number{font-variant-numeric:tabular-nums}
.report-empty{margin:15px;padding:35px 15px;border:1px dashed #bbb;background:#fafafa;text-align:center;color:#777}
.report-pagination{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 10px;color:#555;font-size:12px}
.page-controls{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.page-controls button{min-width:34px;height:32px;padding:5px 9px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#337ab7;cursor:pointer}
.page-controls button:first-child,.page-controls button:last-child{width:auto;padding:0 10px;border-color:transparent}
.page-controls button.active{border-color:#aaa;background:#eee;color:#333}
.page-controls button:disabled{color:#aaa;cursor:default}
@media(max-width:1120px){.monitor-filter-body{padding:20px 15px 24px}.report-filter-grid{column-gap:24px}.report-filter-grid .field{grid-template-columns:135px minmax(160px,1fr);gap:14px}}
@media(max-width:1000px){.report-filter-grid{grid-template-columns:minmax(0,1fr)}.report-filter-grid .field{grid-template-columns:165px minmax(0,1fr)}}
@media(max-width:760px){.report-filter-grid{display:block}.report-filter-grid .field{grid-template-columns:1fr;gap:5px;margin-bottom:12px}.report-filter-grid .field label{text-align:left}.form-actions{justify-content:flex-start;padding-top:3px}.report-table-wrap{height:460px}.report-pagination{align-items:flex-start;flex-direction:column;gap:8px;padding:10px}}
